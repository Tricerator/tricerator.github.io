<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slepá mapa ČR</title>
  <meta name="description" content="Interaktivní slepá mapa České republiky pro výuku zeměpisu – řeky, hory, města, kraje. Data lze nahrát z Excelu.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 14 9 8l6 2 5-4 9 6-2 7-8 6-9-2-6-3Z"/></svg>
      <h1>Slepá mapa ČR</h1>
    </div>
    <nav class="modes" id="modes" role="tablist" aria-label="Režim">
      <button role="tab" data-mode="atlas">Atlas</button>
      <button role="tab" data-mode="assign">Přiřazování</button>
      <button role="tab" data-mode="find">Najdi na mapě</button>
      <button role="tab" data-mode="guess">Poznej místo</button>
      <button role="tab" data-mode="kraj">Ve kterém kraji?</button>
      <button role="tab" data-mode="data">Data</button>
    </nav>
  </header>

  <div class="cats" id="cats" aria-label="Sekce"></div>

  <main class="layout">
    <section class="map-wrap" id="mapWrap">
      <svg id="map" role="img" aria-label="Slepá mapa České republiky"></svg>
      <div class="map-tools">
        <button id="zoomIn" title="Přiblížit" aria-label="Přiblížit">+</button>
        <button id="zoomOut" title="Oddálit" aria-label="Oddálit">−</button>
        <button id="zoomReset" title="Celá mapa" aria-label="Celá mapa">⤢</button>
      </div>
      <div class="map-opts">
        <label><input type="checkbox" id="optRegions"> hranice krajů</label>
        <label id="optLabelsWrap"><input type="checkbox" id="optLabels"> popisky</label>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="foot">
    Mapové podklady: hranice krajů a státu © <a href="https://www.cuzk.gov.cz/" target="_blank" rel="noopener">ČÚZK</a> (INSPIRE);
    řeky a nádrže © <a href="https://www.dibavod.cz/" target="_blank" rel="noopener">DIBAVOD</a> (VÚV TGM);
    národní parky a CHKO © <a href="https://www.geology.cz/" target="_blank" rel="noopener">Česká geologická služba</a>;
    okolní státy <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>. Vše zjednodušeno pro měřítko mapy.
  </footer>

  <input type="file" id="fileInput" accept=".xlsx,.xls,.ods,.csv,.txt" hidden>
  <div class="ghost" id="ghost" hidden></div>

  <script src="data/geo.js"></script>
  <script src="data/places.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
