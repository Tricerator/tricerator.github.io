<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Životní cesta · Life Path</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b18; --muted:#5d584f; --line:#d9d3c6;
  --accent:#2f5d50; --accent-ink:#ffffff; --plus:#1f6b3a; --minus:#a3311f; --soft:#ebe6da; --warn:#fbeee9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181a; --card:#1f2225; --ink:#ece8df; --muted:#a8a296; --line:#34383c;
    --accent:#7fbfa9; --accent-ink:#10201b; --plus:#7ccf95; --minus:#f08a76; --soft:#272b2f; --warn:#3a2622; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hud{max-width:560px;margin:0 auto;padding:10px 16px 6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.stat small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat b.neg{color:var(--minus)}
.jobline{max-width:560px;margin:0 auto;padding:0 16px 8px;font-size:14px;color:var(--muted)}
.bar{height:4px;background:var(--soft)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:.2em 0 .5em}
h1{font-size:34px} h2{font-size:25px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:.6em 0}
.mood{font-style:italic;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.box.warn{background:var(--warn)}
.box h3{margin:0 0 4px;font-size:16px}
.box p:last-child{margin-bottom:0}
.lines{list-style:none;padding:0;margin:6px 0 0}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px dashed var(--line)}
.lines li:first-child{border-top:0}
.lines .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.p{color:var(--plus)} .m{color:var(--minus)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
button{font:inherit;cursor:pointer;border-radius:12px;min-height:48px;padding:10px 14px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-align:center;font-weight:600}
button[disabled]{opacity:.45;cursor:not-allowed}
button .t{display:block;font-weight:600}
button .d{display:block;font-size:14px;color:var(--muted)}
button.primary .d{color:inherit}
.die{width:84px;height:84px;margin:14px auto;border-radius:16px;border:2px solid var(--ink);display:grid;place-items:center;font-size:44px;font-weight:700;font-family:Georgia,serif;background:var(--card)}
.die.roll{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:80px}
label{font-weight:600;display:block;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.note{font-size:14px;color:var(--muted)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.langs button{text-align:center}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="hud" aria-live="polite">
    <div class="stat"><small id="lMoney">Peníze</small><b id="hMoney">0</b></div>

<main id="app"></main>

let lang="cs";
const T=()=>L[lang];
const jn=id=>T().jobs[id];

// ---------- STATE ----------
let S;
function fresh(){
  S={money:0,happy:5,round:1,job:null,degree:"none",perm:0,workStart:2,special:{},uni:null,examRetry:false,examDone:false,
     enjoy:null,reason:"",retrained:false,burnout:false,pending:null,partTime:0,partTimeJob:null,laidOff:false,roundPay:0,
     loans:[],car:false,phones:0,log:[],lines:[],path:null,
     stats:{debtRounds:0,overpaid:0,minMoney:0,overtime:0,vac:0,jobChanges:0}};
  const names=Object.keys(POPULAR), w=names.map(n=>POPULAR[n]), tot=w.reduce((a,b)=>a+b,0);
  S.classCounts={}; Object.keys(JOBS).forEach(n=>S.classCounts[n]=0);
  for(let i=0;i<23;i++){let r=Math.random()*tot; for(let j=0;j<names.length;j++){r-=w[j]; if(r<=0){S.classCounts[names[j]]++;break;}}}
}
const $=s=>document.querySelector(s), app=$("#app");
const d6=()=>1+Math.floor(Math.random()*6);
const job=()=>JOBS[S.job]||{};
const working=()=>!!S.job && S.round>=S.workStart;
const sign=n=>(n>0?"+":n<0?"−":"±")+Math.abs(n);
const crowd=n=>S.classCounts[n]+1;
const age=()=>S.round>ROUNDS?51:AGES[S.round-1];
function jobPay(){ const j=job(); return (S.job==="prog"&&S.degree==="bc"?j.bcPay:j.pay)+S.perm; }

function hud(){
  const t=T();
  $("#lMoney").textContent=t.money; $("#lHappy").textContent=t.happy; $("#lAge").textContent=t.age;
  const m=$("#hMoney"); m.textContent=S.money; m.className=S.money<0?"neg":"";
  const h=$("#hHappy"); h.textContent=S.happy; h.className=S.happy<=2?"neg":"";
  $("#hAge").textContent=age();
  let jl=S.job?jn(S.job):t.noJob;
  if(S.job && !working()) jl+=" · "+t.studying;
  if(S.job && working()) jl+=` · ${t.pay} ${jobPay()}`;
  if(S.enjoy!==null) jl+=" · "+(S.enjoy>0?t.enjoyYes:S.enjoy<0?t.enjoyNo:t.enjoyOk);
  const lp=S.loans.reduce((a,l)=>a+l.per,0); if(lp) jl+=` · ${t.repay} ${lp}`;
  $("#hJob").textContent=jl;
  $("#hBar").style.width=(Math.min(S.round-1,ROUNDS)/ROUNDS*100)+"%";
}
function add(label,money=0,happy=0){ S.money+=money; S.happy=Math.max(0,S.happy+happy); S.lines.push({label,money,happy}); }
function linesHTML(lines){
  if(!lines.length) return ""; const t=T();
  return `<ul class="lines">${lines.map(l=>`<li><span>${l.label}</span><span class="v">${
    [l.money?`<span class="${l.money>0?'p':'m'}">${sign(l.money)} ${t.unitM}</span>`:"", l.happy?`<span class="${l.happy>0?'p':'m'}">${sign(l.happy)} ${t.unitH}</span>`:""].filter(Boolean).join("<br>")||"—"
  }</span></li>`).join("")}</ul>`;
}
const box=(title,html,cls="")=>`<div class="box ${cls}">${title?`<h3>${title}</h3>`:""}${html}</div>`;
function render(html,choices){
  app.innerHTML=html+(choices?`<div class="choices">${choices.map((c,i)=>
    `<button data-i="${i}" class="${c.primary?'primary':''}" ${c.disabled?'disabled':''}><span class="t">${c.t}</span>${c.d?`<span class="d">${c.d}</span>`:""}</button>`).join("")}</div>`:"");
  if(choices) app.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>choices[+b.dataset.i].go());
  hud(); window.scrollTo({top:0});
  const f=app.querySelector("button:not([disabled]),textarea"); if(f) f.focus({preventScroll:true});
}
const kick=()=>`<p class="kicker">${T().round(S.round,age())}</p>`;
function rollDie(title,text,after){
  const t=T();
  render(`<p class="kicker">${title}</p><h2>${t.rollTitle}</h2><p>${text}</p><div class="die" id="die">?</div>`,
    [{t:t.roll,primary:true,go:()=>{
      const die=$("#die"); die.classList.add("roll"); app.querySelector("button").disabled=true;
      let k=0; const iv=setInterval(()=>{die.textContent=d6(); if(++k>9){clearInterval(iv); const r=d6(); die.textContent=r; die.classList.remove("roll"); setTimeout(()=>after(r),600);}},65);
    }}]);
}
const btn=(pair,go,extra={})=>({t:pair[0],d:pair[1],go,...extra});

// ---------- START ----------
function start(){
  fresh(); hud();
  app.innerHTML=`<p class="kicker">Životní cesta · Life Path</p><h1>Vyber jazyk<br><span style="font-size:.7em;color:var(--muted)">Choose your language</span></h1>
    <div class="langs"><button id="cs"><span class="t">Čeština</span></button><button id="en"><span class="t">English</span></button></div>`;
  $("#cs").onclick=()=>{lang="cs";document.documentElement.lang="cs";intro();};
  $("#en").onclick=()=>{lang="en";document.documentElement.lang="en";intro();};
  $("#hJob").textContent="";
}
function intro(){ render(T().intro,[{t:T().start,primary:true,go:choosePath},{t:lang==="cs"?"English version":"Česká verze",go:()=>{lang=lang==="cs"?"en":"cs";document.documentElement.lang=lang;intro();}}]); }
function choosePath(){
  const t=T();
  render(`${kick()}<h2>${t.choosePath}</h2>`, Object.entries(t.paths).map(([k,p])=>btn(p,()=>chooseJob(k))));
}
function jobButtons(cats,onPick,exclude=[]){
  const t=T();
  return Object.entries(JOBS).filter(([n,j])=>cats.includes(j.cat)&&!exclude.includes(n))
    .map(([n,j])=>({t:jn(n),d:t.payLine(n,j.pay)+(j.state?t.stateJob:""),go:()=>onPick(n)}));
}
function chooseJob(cat){
  S.path=cat;
  render(`<p class="kicker">${T().paths[cat][0]}</p><h2>${T().chooseJob}</h2>`,[...jobButtons([cat],whyJob),{t:T().back,go:choosePath}]);
}
function whyJob(n){
  const t=T();
  render(`<p class="kicker">${jn(n)}</p><h2>${t.why}</h2><p>${t.whyText}</p><label for="why">${t.whyLabel}</label><textarea id="why" maxlength="200"></textarea>`,
    [{t:t.next,primary:true,go:()=>{S.reason=$("#why").value.trim(); S.job=n; round1();}}]);
}

// ---------- ROUND 1 ----------
function round1(){
  const t=T(), j=job(); S.lines=[];
  let txt;
  if(j.cat==="VL"){ txt=t.r1VL; add(t.l_praxe,1); if(j.stip) add(t.l_stip,1); S.workStart=2; }
  else if(j.cat==="M"){ txt=t.r1M; add(t.l_noPay,0); S.workStart=2; S.special[2]={v:j.pay-2,l:t.l_halfFirst}; }
  else { txt=t.r1VS; add(t.l_noPay,0); S.workStart=99; S.uni=2; }
  render(`${kick()}<h2>${t.r1Title}</h2><p>${txt}</p>${box(t.classTitle,`<p>${t.classTxt(crowd(S.job))}</p>`)}${box("",linesHTML(S.lines))}<p class="note">${t.r1Note}</p>`,
    [{t:t.nextRound,primary:true,go:nextRound}]);
}

// ---------- ROUND FLOW ----------
function nextRound(){
  S.log.push({age:`${AGES[S.round-1]}–${AGES[S.round-1]+3}`,money:S.money,happy:S.happy,job:S.job});
  S.round++;
  if(S.round>ROUNDS) return finale1();
  S.lines=[]; S.laidOff=false;
  if(S.pending){ S.job=S.pending; S.pending=null; S.perm=0; S.enjoy=null; S.workStart=S.round; S.degree="none"; S.stats.jobChanges++; }
  if(S.partTime===0 && S.partTimeJob){ S.job=S.partTimeJob; S.partTimeJob=null; S.perm=0; S.enjoy=null; S.workStart=S.round; S.degree=JOBS[S.job].needsMgr?"mgr":"bc"; S.stats.jobChanges++; }
  const j=job();
  if(j.cat==="VS" && S.round===S.uni && !S.examDone) return exams();
  if(j.cat==="VS" && !j.doctor && S.round===S.uni+1 && S.degree==="none" && S.examDone) return bcChoice();
  roundSummary("");
}
function exams(){
  const t=T(), doc=job().doctor;
  rollDie(t.round(S.round,age()), `<b>${S.examRetry?t.examsAgain:t.exams}.</b> ${t.examsTxt(doc)}`, r=>{
    const fail=doc?r<=2:r===1;
    if(!fail){
      S.examDone=true; S.uni=S.round;
      if(doc){ S.special[S.round+2]={v:4,l:t.l_junior}; S.workStart=S.round+3; }
      return render(`${kick()}<h2>${t.accepted}</h2><p>${t.rolled(r)}. ${t.acceptedTxt(doc)}</p>`,[{t:t.next,primary:true,go:()=>roundSummary("")}]);
    }
    if(!S.examRetry){
      render(`${kick()}<h2>${t.rejected}</h2><p>${t.rolled(r)}. ${t.rejectedTxt}</p>`,
        [btn([t.retry,t.retryD],()=>{S.examRetry=true; S.uni=S.round+1; S.special[S.round]={v:3,l:t.l_brig}; roundSummary("");}),
         ...jobButtons(["M"],n=>{S.job=n; S.workStart=S.round; S.special[S.round]={v:JOBS[n].pay-2,l:t.l_halfFirst}; S.stats.jobChanges++; roundSummary("");}).map(b=>({...b,t:t.goWork+b.t}))]);
    } else {
      render(`${kick()}<h2>${t.rejected2}</h2><p>${t.rolled(r)}. ${t.rejected2Txt}</p>`,
        jobButtons(["M"],n=>{S.job=n; S.workStart=S.round; S.stats.jobChanges++; roundSummary("");}));
    }
  });
}
function bcChoice(){
  const t=T(), j=job(), id=S.job;
  const bcId=j.needsMgr?j.bcJob:id, bcP=j.needsMgr?JOBS[bcId].pay:j.bcPay;
  render(`${kick()}<h2>${t.bcTitle}</h2><p>${t.bcTxt(id)}</p>`,[
    btn([t.bcWork(id),t.bcWorkD(bcP)],()=>{ if(j.needsMgr){S.job=bcId;} S.degree="bc"; S.workStart=S.round; S.special[S.round]={v:Math.floor(bcP/2),l:t.l_halfFirst}; roundSummary(""); }),
    btn([t.mgr,t.mgrD(j.pay)],()=>{ S.degree="mgr"; S.workStart=S.round+1; roundSummary(""); })
  ]);
}
function currentPay(){
  const t=T(), sp=S.special[S.round];
  if(sp) return {v:sp.v,l:sp.l};
  if(!working()) return {v:0,l:t.l_noPay};
  let v=jobPay(), l=t.l_pay(S.job);
  if(S.partTime>0){ v=Math.floor(v/2); l+=t.l_partHalf; S.partTime--; }
  return {v,l};
}
function worldEvent(){
  const t=T(), Y=t.Y, r=S.round, n=S.job, w=working(), j=job(), vl=j.cat==="VL";
  let you="";
  if(r===2){ you = S.special[2]&&S.special[2].l===t.l_brig ? Y.s2_work : !w&&!S.special[2] ? Y.s2_stud : vl ? Y.s2_VL : j.cat==="M"&&S.path==="M" ? Y.s2_M : Y.s2_work; }
  if(r===3){ if(w&&["elec","tech"].includes(n)){add(t.W[3][0],2); you=Y.boomYes;} else you=w?Y.boomNo:Y.boomStud; }
  if(r===4){
    if(!w) you=Y.aiStud;
    else if(n==="acct"){S.perm-=1; add(t.W[4][0],-1); you=Y.aiAcct;}
    else if(n==="prog"){ if(S.degree==="mgr") you=Y.aiProgMgr; else {add(t.W[4][0],-1); you=Y.aiProgBc;} }
    else if(n==="para"){S.perm-=1; add(t.W[4][0],-1); you=Y.aiPara;}
    else if(n==="teacher"||n==="asst") you=Y.aiTeach;
    else you=vl?Y.aiVL:Y.aiOther;
  }
  if(r===5){ if(w&&(n==="teacher"||n==="asst")){S.perm+=1; add(t.W[5][0],1); you=Y.teachYes;} else you=Y.teachNo; }
  if(r===6){
    if(!w) you=Y.crisisStud;
    else if(n==="cook"){add(t.W[6][0],-2); you=Y.crisisCook;}
    else if(n==="hair"){add(t.W[6][0],-2); you=Y.crisisHair;}
    else if(j.state) you=Y.crisisState;
    else {add(t.W[6][0],-1); you=Y.crisisPriv;}
  }
  if(r===7){ if(w&&!j.state){add(t.W[7][0],1); you=Y.upPriv;} else you=Y.upNo; }
  if(r===8){ if(w&&vl){S.perm+=1; add(t.W[8][0],1); you=Y.tradeYes;} else you=Y.tradeNo; }
  if(r===9){
    const hit=["acct","graph","para"].includes(n);
    if(w&&(hit||n==="lawyer")&&S.retrained) you=Y.ai2Prot;
    else if(w&&hit){S.perm-=1; add(t.W[9][0],-1); you=Y.ai2Hit;}
    else if(w&&n==="lawyer"){add(t.W[9][0],-1); you=Y.ai2Law;}
    else if(w&&n==="prog"){ if(S.degree==="mgr"){S.perm+=1; add(t.W[9][0],1); you=Y.ai2ProgMgr;} else you=Y.ai2ProgBc; }
    else you=Y.ai2No;
  }
  if(r===10){ add(t.W[10][0],-1); you=Y.energy; }
  if(r===11){ add(t.W[11][0],-2); you=Y.prices(S.money<0); }
  if(r===12){ if(vl&&w){add(t.W[12][0],-1,-1); you=Y.bodyVL;} else {add(t.W[12][0],0,-1); you=Y.bodyOther;} }
  return [t.W[r][0],t.W[r][1],you];
}
function roundSummary(pre){
  const t=T(); S.lines=[];
  const moodTxt=t.mood(S.happy);
  const p=currentPay(); let pay=p.v, l=p.l;
  if(S.burnout&&pay>0){ pay=Math.floor(pay/2); l+=t.l_burnHalf; }
  S.burnout=false; S.roundPay=pay;
  add(l,pay); add(t.l_cost,-COST);
  S.loans.forEach(x=>{ add(t.l_loan(x.name),-x.per); x.left--; });
  S.loans=S.loans.filter(x=>x.left>0);
  const E=worldEvent();
  if(working()&&pay>0){ const c=crowd(S.job); if(c>=6) add(t.l_crowd(c),-2); else if(c>=4) add(t.l_crowd(c),-1); }
  if(S.enjoy!==null&&working()) add(t.l_enjoy(S.enjoy),0,S.enjoy);
  const firstWork=working()&&S.enjoy===null;
  render(`${kick()}<p class="mood">${moodTxt}</p>${pre?`<p>${pre}</p>`:""}<h2>${E[0]}</h2><p>${E[1]}</p>
    ${box(t.andYou,`<p>${E[2]}</p>`)}${box(t.whatHappened,linesHTML(S.lines))}`,
    [{t:firstWork?t.enjoyBtn:t.personalBtn,primary:true,go:firstWork?enjoyRoll:personal}]);
}
function enjoyRoll(){
  const t=T(), bonus=S.reason.length>=5?1:0;
  rollDie(t.round(S.round,age()),`<b>${t.enjoyTitle}</b> ${t.enjoyRoll(bonus)}`,r=>{
    const v=Math.min(6,r+bonus); S.enjoy=v<=2?-1:v<=4?0:1;
    S.lines=[]; add(t.l_enjoy(S.enjoy),0,S.enjoy);
    const [h,txt]=t.enjoyRes(S.enjoy);
    render(`<p class="kicker">${t.rolled(r)}${bonus?" (+1 = "+v+")":""}</p><h2>${h}</h2><p>${txt}</p>${box("",linesHTML(S.lines))}`,
      [{t:t.personalBtn,primary:true,go:personal}]);
  });
}
function personal(){
  const t=T(), P=t.P;
  rollDie(t.round(S.round,age()),`<b>${t.personalTitle}.</b> ${t.personalTxt}`,r=>{
    S.lines=[]; const w=working(), j=job(), vl=j.cat==="VL"; let ev;
    if(r===1){ if(!w){ev=P.sickStud; add(P.l_sick,-1,-1);} else if(vl){ev=P.injury; add(P.l_injury,-3,-1);} else {ev=P.sick; add(P.l_sick,-1,-1);} }
    if(r===2){ if(!w) ev=P.calmStud; else if(j.state) ev=P.layoffState; else {ev=P.layoff; add(P.l_layoff,-Math.ceil(S.roundPay/2),-1); S.laidOff=true;} }
    if(r===3){ if(S.car){ev=P.carBroke; add(P.l_car,-2);} else ev=P.calm; }
    if(r===4){ if(!w){ev=P.stip; add(P.l_stip,3);} else if(vl){ev=P.reco; add(P.l_reco,3);} else {ev=P.promo; add(P.l_promo,3);} }
    if(r===5){ ev=P.family; add(P.l_family,-1,2); }
    if(r===6){
      if(w) return render(`<p class="kicker">${t.rolled(6)}</p><h2>${P.abroad[0]}</h2><p>${P.abroad[1]}</p>`,[
        btn(P.abroadY,()=>{add(P.l_abroad,4,-2); story(P.abroadYT);}), btn(P.abroadN,()=>story(P.abroadNT))]);
      return render(`<p class="kicker">${t.rolled(6)}</p><h2>${P.eras[0]}</h2><p>${P.eras[1]}</p>`,[
        btn(P.erasY,()=>{add(P.l_eras,-1,2); story(P.erasYT);}), btn(P.erasN,()=>story(P.erasNT))]);
    }
    render(`<p class="kicker">${t.rolled(r)}</p><h2>${ev[0]}</h2><p>${ev[1]}</p>${S.lines.length?box("",linesHTML(S.lines)):""}`,
      [{t:t.decideBtn,primary:true,go:decideWork}]);
  });
}
function story(ev){ render(`${kick()}<h2>${ev[0]}</h2><p>${ev[1]}</p>${S.lines.length?box("",linesHTML(S.lines)):""}`,[{t:T().decideBtn,primary:true,go:decideWork}]); }

// ---------- DECISIONS ----------
let C; // texts collected for consequence screen
function decideWork(){
  const t=T(), w=working(), j=job(), free=S.laidOff;
  S.lines=[]; C=[];
  const busy=S.pending||S.partTime>0||S.partTimeJob;
  const pre=(S.round===7&&S.happy<=4)?t.friend:"";
  let ch;
  if(!w){
    ch=[btn(t.w_study,()=>{C.push(t.t_study); decideSpend();}),
        btn(t.w_brig,()=>{add(t.l_brigL,2,-1); C.push(t.t_brig); decideSpend();})];
  } else {
    ch=[btn(t.w_normal,()=>{C.push(t.t_normal(S.happy)); decideSpend();}),
        btn(t.w_over,()=>{add(t.l_over,2,-1); S.stats.overtime++; C.push(t.t_over(S.stats.overtime)); decideSpend();})];
    if(!busy && S.round<ROUNDS){
      ch.push(btn(t.w_retr(free),()=>render(`<h2>${t.retrTitle}</h2><p>${t.retrTxt}</p>`,
        [...jobButtons(["VL","M"],n=>{ if(!free) add(t.l_retr,-2); S.pending=n; S.retrained=true; C.push(t.t_retr(free,jn(n))); decideSpend(); },[S.job]),{t:t.back,go:decideWork}])));
      if(!["VS","BC"].includes(j.cat) && S.round<=ROUNDS-3)
        ch.push(btn(t.w_part,()=>render(`<h2>${t.partTitle}</h2>`,
          [...Object.keys(JOBS).filter(k=>JOBS[k].cat==="VS"&&!JOBS[k].doctor).map(k=>({t:jn(k),d:t.partD(k),go:()=>{
            S.partTime=JOBS[k].needsMgr?3:2; S.partTimeJob=k; S.retrained=true; C.push(t.t_part); decideSpend(); }})),{t:t.back,go:decideWork}])));
    }
  }
  render(`${kick()}<h2>${t.decideWork}</h2>${pre}`,ch);
}
function decideSpend(){
  const t=T();
  const ch=[
    btn(t.s_none,()=>{C.push(t.t_none(S.money)); consequence();}),
    btn(t.s_fun,()=>{add(t.l_fun,-1,1); C.push(t.t_fun); consequence();}),
    btn(t.s_phone,()=>{S.phones++; add(t.l_phone,-2,S.phones===1?1:0); C.push(t.t_phone(S.phones)); consequence();}),
    btn(t.s_vac,()=>{const poor=S.money<3; add(t.l_vac,-3,2); S.stats.vac++; C.push(t.t_vac(poor)); consequence();})
  ];
  if(!S.car){
    ch.push(btn(t.s_car,()=>{add(t.l_car,-6,2); S.car=true; C.push(t.t_car); consequence();}));
    ch.push(btn(t.s_carLoan,()=>{add(t.l_car,0,2); S.car=true; S.loans.push({name:t.loanCar,per:2,left:4}); S.stats.overpaid+=2; C.push(t.t_carLoan); consequence();}));
  }
  ch.push(btn(t.s_loan,()=>{add(t.l_loanIn,5,0); S.loans.push({name:t.loanQuick,per:2,left:4}); S.stats.overpaid+=3; C.push(t.t_loan); consequence();}));
  render(`${kick()}<h2>${t.decideSpend}</h2>`,ch);
}
function consequence(){
  const t=T();
  render(`${kick()}<h2>${t.consTitle}</h2>${C.map(x=>`<p>${x}</p>`).join("")}${S.lines.length?box("",linesHTML(S.lines)):""}`,
    [{t:t.next,primary:true,go:endCheck}]);
}
function endCheck(){
  const t=T(); S.lines=[]; const msg=[];
  if(S.money<0){ add(t.l_interest,-1); S.stats.debtRounds++; S.stats.overpaid++; msg.push(t.debt); }
  if(S.money<=-10){ add(t.l_exek,0,-1); msg.push(t.exek); }
  if(S.happy<=2){ S.burnout=true; msg.push(t.burn); }
  S.stats.minMoney=Math.min(S.stats.minMoney,S.money);
  if(!msg.length) return nextRound();
  render(`${kick()}<h2>${t.warn}</h2>${msg.map(m=>`<p>${m}</p>`).join("")}${box("",linesHTML(S.lines),"warn")}`,
    [{t:S.round<ROUNDS?t.nextRound:t.finalBtn,primary:true,go:nextRound}]);
}

// ---------- FINALE: hardships ----------
function finale1(){
  const t=T(); S.lines=[];
  const poor=S.money<4;
  render(`<p class="kicker">${t.finKicker}</p><h2>${t.parents[0]}</h2><p>${t.parents[1]}</p>`,[
    btn(t.parPay,()=>{ if(poor){add(t.l_par,0,-2); fin(t.parPayPoor,finale2);} else {add(t.l_par,-4,0); fin(t.parPayT,finale2);} }),
    btn(t.parSelf,()=>{add(t.l_par,0,-2); fin(t.parSelfT,finale2);})]);
}
function fin(txt,next,title){ const t=T();
  render(`<p class="kicker">${t.finKicker}</p>${title?`<h2>${title}</h2>`:""}<p>${txt}</p>${S.lines.length?box("",linesHTML(S.lines)):""}`,[{t:t.next,primary:true,go:next}]); }
function finale2(){
  const t=T(); S.lines=[];
  const inDebt=S.money<0||S.loans.length>0;
  if(inDebt) add(t.l_debts,0,-2);
  fin(inDebt?t.debtsYes:t.debtsNo,finale3,t.debtsT);
}
function finale3(){
  const t=T(); S.lines=[];
  if(S.money>=30) add(t.l_pension,0,1); else if(S.money<10) add(t.l_pension,0,-1);
  fin(t.pensionTxt(S.money),end,t.pensionT);
}

// ---------- END ----------
function end(){
  const t=T(), m=S.money, h=S.happy;
  const key=m>=20&&h>=10?"both":m>=20?"rich":h>=10?"happy":"hard";
  const [title,desc]=t.endings[key];
  S.stats.minMoney=Math.min(S.stats.minMoney,m);
  render(`<p class="kicker">${t.finKicker}</p><h1>${title}</h1><p>${desc}</p>
    ${box(t.pathT,`<table><thead><tr><th>${t.thAge}</th><th>${t.thJob}</th><th>${t.thM}</th><th>${t.thH}</th></tr></thead><tbody>
      ${S.log.map(l=>`<tr><td>${l.age}</td><td>${l.job?jn(l.job):"—"}</td><td>${l.money}</td><td>${l.happy}</td></tr>`).join("")}
      <tr><td><b>51</b></td><td><b>${jn(S.job)}</b></td><td><b>${m}</b></td><td><b>${h}</b></td></tr></tbody></table>`)}
    ${box(t.statsT,`<ul class="lines">${t.st(S.stats).map(([a,b])=>`<li><span>${a}</span><span class="v">${b}</span></li>`).join("")}</ul>`)}
    ${box(t.realT,t.real)}
    ${box(t.reflT,`<ol style="margin:0;padding-left:20px">${t.refl.map(q=>`<li>${q}</li>`).join("")}</ol>`)}`,
    [{t:t.again,primary:true,go:start}]);
}
start();
</script>
